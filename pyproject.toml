[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "governed-gateway"
version = "0.1.0"
description = "Keyless finite-budget governed gateway"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["pydantic==2.12.5", "cryptography==46.0.3"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["gateway*"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.14.2", "httpx==0.28.1"]
