[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "governed-gateway"
version = "0.1.0"
description = "Keyless source construction of a finite-budget governed gateway"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pydantic==2.12.5", "cryptography==46.0.3"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["gateway*"]

[tool.uv]
package = true
